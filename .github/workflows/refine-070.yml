name: Refine 0.7.0 visual crop and idle capsule

on:
  push:
    branches: [ci/refine-visual-crop-idle-capsule-070]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/refine-visual-crop-idle-capsule-070
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Switch to candidate and apply audit refinements
        run: |
          cp .github/refine-070.py /tmp/refine-070.py
          git fetch origin feature/visual-crop-idle-capsule-070
          git switch -C feature/visual-crop-idle-capsule-070 origin/feature/visual-crop-idle-capsule-070
          python /tmp/refine-070.py

      - name: Install dependencies
        run: npm ci

      - name: Web tests
        run: npm test

      - name: Production web build
        run: npm run build

      - name: Android unit tests
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Diff check
        run: git diff --check

      - name: Guard backup implementation
        run: |
          if git diff --name-only | grep -E '(^|/)(backup|android-backup|android-restore|import-source)'; then
            echo 'Unexpected backup/import implementation change' >&2
            exit 1
          fi

      - name: Commit audited refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css android/app/src/main/java/com/puff/meme/FloatingWindowService.java
          git commit -m "fix: refine crop touch targets and capsule wake timing"
          git push origin HEAD:feature/visual-crop-idle-capsule-070
