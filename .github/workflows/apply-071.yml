name: Apply 0.7.1 share and crop polish

on:
  push:
    branches: [ci/apply-share-crop-polish-071]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/apply-share-crop-polish-071
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Switch to candidate and apply patch
        run: |
          cp .github/apply-071.py /tmp/apply-071.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply-071.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "it('moves and resizes the visual crop without leaving the image bounds', () => {",
              "it('moves and resizes visual crops without leaving the preview bounds', () => {",
          )
          p.write_text(text, encoding='utf-8')
          PY
          git fetch origin fix/share-crop-polish-071
          git switch -C fix/share-crop-polish-071 origin/fix/share-crop-polish-071
          python /tmp/apply-071.py

      - name: Install dependencies
        run: npm ci

      - name: Web tests
        run: npm test

      - name: Production web build
        run: npm run build

      - name: Android unit tests
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Diff check
        run: git diff --check

      - name: Guard backup implementation
        run: |
          if git diff --name-only | grep -E '(^|/)(backup|android-backup|android-restore|import-source)'; then
            echo 'Unexpected backup/import implementation change' >&2
            exit 1
          fi

      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android/app/build.gradle \
            android/app/src/main/java/com/puff/meme/FloatingWindowPlugin.java \
            src/App.tsx src/components/VisualCropper.tsx src/lib/image-edit.ts \
            src/lib/library.ts src/lib/platform.ts src/lib/floating-mini.ts \
            src/styles.css tests/image-edit.test.ts
          git commit -m "fix: make floating share repeatable and polish crop editing"
          git push origin HEAD:fix/share-crop-polish-071
